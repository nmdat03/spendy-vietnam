<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="text-scale" content="scale" />

		<!-- PWA manifest is injected by vite-plugin-pwa -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf8" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c10" />
		<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

		<!-- iOS standalone -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Spendy" />
		<meta name="application-name" content="Spendy" />

		<!-- Open Graph -->
		<meta property="og:title" content="Spendy Việt Nam" />
		<meta property="og:description" content="Ứng dụng quản lý thu chi cá nhân." />

		<style>
			:root {
				--splash-bg: #fafaf8;
				--splash-text: #1a1a20;
				--splash-sub: #8b8b96;
				--splash-accent: #6d3ae8;
			}
			:root[data-theme='dark'] {
				--splash-bg: #0c0c10;
				--splash-text: #f4f4f5;
				--splash-sub: #9d9da8;
				--splash-accent: #9a72f0;
			}
			#splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 18px;
				background: var(--splash-bg);
				color: var(--splash-text);
				transition:
					opacity 0.35s ease,
					visibility 0.35s ease;
				-webkit-font-smoothing: antialiased;
			}
			#splash.hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			#splash img {
				width: 84px;
				height: 84px;
				border-radius: 24px;
				box-shadow: 0 12px 32px rgba(109, 58, 232, 0.16);
			}
			#splash .title {
				font-size: 26px;
				font-weight: 800;
				letter-spacing: -0.02em;
				font-family:
					Inter,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
			}
			#splash .sub {
				font-size: 13px;
				color: var(--splash-sub);
				font-weight: 550;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				font-family:
					Inter,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
			}
			#splash .spinner {
				width: 22px;
				height: 22px;
				border: 2.5px solid color-mix(in srgb, var(--splash-accent) 25%, transparent);
				border-top-color: var(--splash-accent);
				border-radius: 50%;
				animation: splash-spin 0.8s linear infinite;
				margin-top: 8px;
			}
			@keyframes splash-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash .spinner {
					animation: none;
					opacity: 0.4;
				}
			}
		</style>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('spendy-theme');
					var theme = stored || 'auto';
					var isDark =
						theme === 'dark' ||
						(theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
				} catch (e) {
					// Fallback to light if storage is unavailable.
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" aria-busy="true" aria-label="Memuat Spendy">
			<img src="/icons/icon.svg" alt="" />
			<div class="title">Spendy</div>
			<div class="sub">Track every rupiah</div>
			<div class="spinner"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
