<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="text-scale" content="scale" />

		<!-- PWA manifest is injected by vite-plugin-pwa -->
		<meta name="theme-color" content="#0b0f17" />
		<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

		<!-- iOS standalone -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Spendy" />
		<meta name="application-name" content="Spendy" />

		<!-- Open Graph -->
		<meta property="og:title" content="SpendyTrack" />
		<meta property="og:description" content="Personal spending tracker PWA." />

		<style>
			:root {
				--splash-bg: #f6f7fb;
				--splash-text: #0b0f17;
				--splash-sub: #6b7280;
			}
			:root[data-theme='dark'] {
				--splash-bg: #0a0c12;
				--splash-text: #f5f7fb;
				--splash-sub: #a5adc0;
			}
			#splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 18px;
				background: var(--splash-bg);
				color: var(--splash-text);
				transition:
					opacity 0.35s ease,
					visibility 0.35s ease;
				-webkit-font-smoothing: antialiased;
			}
			#splash.hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			#splash img {
				width: 84px;
				height: 84px;
				border-radius: 22px;
				box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
			}
			#splash .title {
				font-size: 26px;
				font-weight: 800;
				letter-spacing: -0.02em;
				font-family:
					Inter,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
			}
			#splash .sub {
				font-size: 14px;
				color: var(--splash-sub);
				font-weight: 500;
				font-family:
					Inter,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
			}
			#splash .spinner {
				width: 22px;
				height: 22px;
				border: 2.5px solid var(--splash-sub);
				border-top-color: transparent;
				border-radius: 50%;
				animation: splash-spin 0.8s linear infinite;
				margin-top: 8px;
			}
			@keyframes splash-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash .spinner {
					animation: none;
					border-top-color: var(--splash-sub);
					opacity: 0.5;
				}
			}
		</style>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('spendy-theme');
					var theme = stored || 'auto';
					var isDark =
						theme === 'dark' ||
						(theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
				} catch (e) {
					// Fallback to light if storage is unavailable.
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" aria-busy="true" aria-label="Memuat Spendy">
			<img src="/icons/icon.svg" alt="" />
			<div class="title">Spendy</div>
			<div class="sub">Personal spending tracker</div>
			<div class="spinner"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
